<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>애플데이 퀴즈 대회</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: 송출 화면은 1920×1080 무대를 화면에 맞춰 축소, 태블릿은 세로로 흐르는 터치 화면. 키노트와 같은 검정 바탕 + 빨간 사과 하나. */
:root {
  --bg: #000000;
  --fg: #F5F5F7;
  --muted: #8E8E93;
  --dim: #48484A;
  --glass: rgba(255, 255, 255, 0.06);
  --glass-2: rgba(255, 255, 255, 0.11);
  --line: rgba(255, 255, 255, 0.12);
  --red: #FF3B30;
  --red-deep: #C8160C;
  --panel: #0B0B0C;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  -webkit-font-smoothing: antialiased; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body.lock { overflow: hidden; }
* { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
#app { height: 100%; }

/* ---------- 송출 화면 ---------- */
.host { position: relative; width: 100%; height: 100%; }
.viewport { position: absolute; inset: 0; }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
.view { position: absolute; inset: 0; padding: 96px 120px; display: flex; flex-direction: column; }
.enter .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--d, 0) * 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

.eyebrow { font-size: 30px; font-weight: 500; color: var(--red); letter-spacing: .02em; }
.eyebrow .of { color: var(--dim); }
.h-hero { font-size: 200px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
.h-big { font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; }
.h-title { font-size: 96px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.1; text-wrap: balance; word-break: keep-all; }
.lead { font-size: 44px; font-weight: 400; color: var(--muted); line-height: 1.45; letter-spacing: -0.01em; word-break: keep-all; }
.lead b { color: var(--fg); font-weight: 700; }
.grad { background: linear-gradient(180deg, #FFFFFF 30%, #8E8E93 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head { display: flex; flex-direction: column; gap: 24px; }
.glass { background: var(--glass); border: 1px solid var(--line); }
.pill-red { font-size: 30px; font-weight: 700; padding: 12px 28px; border-radius: 999px; border: 2px solid var(--red); color: var(--red); white-space: nowrap; }
.apple { display: block; filter: drop-shadow(0 40px 80px rgba(255, 40, 30, .35)); }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,59,48,.34) 0%, rgba(255,59,48,0) 65%); pointer-events: none; }

/* 대기실 */
.ltop { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 540px; gap: 80px; align-items: start; }
.view.v-lobby { padding-block: 72px; }
.lcopy { display: flex; flex-direction: column; gap: 32px; }
.lcopy .h-big { font-size: 110px; }
.lsteps { display: flex; flex-direction: column; gap: 10px; }
.lsteps p { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; display: flex; gap: 24px; align-items: baseline; }
.lsteps span { color: var(--red); font-size: 32px; width: 32px; }
.startbtn { align-self: flex-start; font-size: 44px; font-weight: 800; padding: 22px 72px; border-radius: 999px; background: var(--red); border: 0; color: #fff; cursor: pointer; box-shadow: 0 24px 60px rgba(255,59,48,.35); }
.startbtn:hover { background: #ff5147; }
.qrcard { background: #fff; border-radius: 44px; padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.qrcard img { width: 440px; height: 440px; image-rendering: pixelated; display: block; }
.qrcard .url { font-size: 24px; color: #1C1C1E; text-align: center; word-break: break-all; line-height: 1.35; }
.qrcard .cap { font-size: 30px; font-weight: 800; color: #000; }
.lteams { display: flex; flex-direction: column; gap: 20px; }
.lcount { font-size: 34px; color: var(--muted); }
.lcount b { color: var(--fg); font-size: 44px; font-variant-numeric: tabular-nums; }
.teams { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 14px; }
.tm { padding: 16px 0; text-align: center; font-size: 32px; font-weight: 800; border-radius: 22px; border: 1px dashed var(--line); color: var(--dim); letter-spacing: -0.02em; }
.tm.on { border: 1px solid rgba(255,59,48,.5); background: rgba(255,59,48,.14); color: var(--fg); animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; }

/* 라운드 안내 */
.roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; flex: 1; margin-top: 64px; }
.role { padding: 56px 64px; display: flex; flex-direction: column; gap: 28px; border-radius: 44px; }
.role .tag { align-self: flex-start; font-size: 30px; font-weight: 700; padding: 10px 26px; border-radius: 999px; background: var(--red); color: #fff; }
.role .t { font-size: 76px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.12; }
.role .d { font-size: 34px; color: var(--muted); line-height: 1.5; margin-top: auto; }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
.chips { display: flex; gap: 20px; flex-wrap: wrap; }
.chip { font-size: 40px; padding: 22px 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); }
.chip b { color: var(--red); font-weight: 700; }

/* 문제 */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 40px; min-height: 100px; }
.live { display: flex; align-items: center; gap: 32px; }
.live .sub { font-size: 34px; color: var(--muted); }
.live .sub b { color: var(--fg); font-variant-numeric: tabular-nums; }
.timer { font-size: 76px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 190px; text-align: center; padding: 4px 40px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }
.timer.low { color: var(--red); border-color: rgba(255,59,48,.6); }
.qcenter { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
.prompt { font-size: 128px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; text-wrap: balance; word-break: keep-all; }
.cho { display: flex; gap: 36px; }
.cho span { width: 270px; height: 310px; display: grid; place-items: center; font-size: 200px; font-weight: 900; border-radius: 44px; }
.emo.sm { font-size: 150px; letter-spacing: .04em; }
.cho.sm { gap: 22px; }
.cho.sm span { width: 190px; height: 230px; font-size: 140px; border-radius: 36px; }
.cho i { width: 40px; flex: none; }
.emo { white-space: nowrap; font-family: var(--emoji); font-size: 260px; line-height: 1.15; letter-spacing: .1em; }
.qsplit { flex: 1; display: flex; align-items: center; gap: 100px; min-height: 0; }
.qsplit .copy { flex: 1; display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.board { width: 700px; height: 700px; flex: none; padding: 36px; border-radius: 48px; }
.board svg { width: 100%; height: 100%; display: block; }
.vframe { flex: none; border-radius: 40px; overflow: hidden; background: #111; border: 1px solid var(--line); }
.vframe video { display: block; height: 780px; width: auto; max-width: 1040px; object-fit: contain; }
.r1foot { display: flex; align-items: center; gap: 24px; font-size: 36px; color: var(--muted); }
.closedbadge { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); font-size: 40px; font-weight: 800; padding: 22px 56px; border-radius: 999px; background: var(--red); color: #fff; box-shadow: 0 24px 60px rgba(255,59,48,.4); display: none; white-space: nowrap; }
.view.closed .r1foot { visibility: hidden; }
.view.closed .closedbadge { display: block; animation: pop .5s cubic-bezier(.2,.9,.3,1.2) both; }
.tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: rgba(255,255,255,.06); }
.tbar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .2s linear; }

/* 정답 공개 */
.rtitle { font-size: 80px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.15; margin-top: 12px; word-break: keep-all; }
.rtitle.e { font-family: var(--emoji); letter-spacing: .08em; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 28px; flex: 1; margin-top: 44px; min-height: 0; }
.opt { position: relative; overflow: hidden; border-radius: 36px; padding: 32px 44px; display: flex; align-items: center; gap: 36px; min-width: 0; }
.opt .n { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; font-weight: 800; background: var(--glass-2); }
.opt .lab { flex: 1; font-size: 52px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; word-break: keep-all; min-width: 0; }
.opt .pic { flex: 1; height: 100%; display: flex; align-items: center; }
.opt .pic svg { height: 100%; max-height: 300px; aspect-ratio: 1; }
.opt .cnt { flex: none; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.opt .bar { position: absolute; left: 0; bottom: 0; height: 10px; background: rgba(255,255,255,.22); }
.opt.ok { background: linear-gradient(160deg, #FF5147, #C8160C); border-color: transparent; box-shadow: 0 30px 80px rgba(255,59,48,.35); }
.opt.ok .cnt { color: #fff; }
.opt.ok .n { background: rgba(255,255,255,.25); }
.opt.ok .bar { background: #fff; }
.opt.no { opacity: .42; }
.ansrow { display: flex; align-items: center; gap: 40px; margin-top: 56px; }
.ansbig { font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; padding: 36px 80px; border-radius: 48px; background: linear-gradient(160deg, #FF5147, #C8160C); box-shadow: 0 30px 80px rgba(255,59,48,.35); }
.subs { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 56px; align-content: flex-start; }
.sub-c { font-size: 34px; padding: 14px 30px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--muted); }
.sub-c b { color: var(--fg); margin-left: 10px; font-variant-numeric: tabular-nums; }
.sub-c.ok { background: rgba(255,59,48,.18); border-color: rgba(255,59,48,.6); color: var(--fg); }
.pname { opacity: 0; transform: scale(.9); transition: opacity .6s ease, transform .7s cubic-bezier(.2,.9,.3,1.2); }
.pname.show { opacity: 1; transform: none; }

/* 순위 */
.rlist { display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
.rrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 220px 280px; align-items: center; padding: 16px 48px; border-radius: 32px; background: var(--glass); border: 1px solid var(--line); }
.rrow .rk { font-size: 56px; font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
.rrow .nm { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; }
.rrow .gain { justify-self: start; font-size: 32px; font-weight: 700; color: var(--red); }
.rrow .sc { justify-self: end; font-size: 60px; font-weight: 900; font-variant-numeric: tabular-nums; }
.rrow.first { background: linear-gradient(160deg, #FF5147, #C8160C); border-color: transparent; box-shadow: 0 30px 80px rgba(255,59,48,.3); }
.rrow.first .rk, .rrow.first .gain { color: rgba(255,255,255,.85); }
.empty { font-size: 44px; color: var(--muted); margin-top: 80px; }
.nexthint { margin-top: auto; font-size: 30px; color: var(--dim); }

/* 최종 */
.s-award { align-items: center; justify-content: center; text-align: center; gap: 40px; }
.s-award .glow { width: 1300px; height: 1300px; left: 310px; top: -110px; }
.s-award > :not(.glow) { position: relative; }
.prizepill { font-size: 44px; font-weight: 800; padding: 22px 56px; border-radius: 999px; background: var(--red); color: #fff; }
.ftable { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; margin-top: 32px; grid-auto-flow: column; }
.frow { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 8px 28px; border-radius: 20px; background: var(--glass); font-size: 34px; }
.frow .rk { color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.frow .nm { font-weight: 800; }
.frow .sc { font-weight: 800; font-variant-numeric: tabular-nums; }
.frow .pz { font-size: 24px; color: var(--red); font-weight: 700; margin-left: 12px; }
.frow.top { background: rgba(255,59,48,.18); }

/* 진행 버튼 */
.hud { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; z-index: 6; opacity: .2; transition: opacity .3s; }
.host:hover .hud, .hud:focus-within { opacity: 1; }
@media (hover: none) { .hud { opacity: 1; } }
.hud button { font: 500 15px var(--font); color: var(--fg); background: rgba(40,40,42,.85); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.hud button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
.hud button.warn { border-color: var(--red); color: var(--red); }
.hud .hphase { font: 500 14px var(--font); color: var(--muted); padding: 0 6px; }
.modetag { position: absolute; left: 16px; top: 16px; z-index: 6; font: 500 13px var(--font); color: var(--muted); background: rgba(40,40,42,.85); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }


/* ---------- 키노트 슬라이드 (원본 디자인, .deck 안에서만 적용) ---------- */
.deck { position: absolute; inset: 0; z-index: 3; background: var(--bg); }
.deck .slide {
  position: absolute; inset: 0; padding: 120px 140px;
  display: flex; flex-direction: column; opacity: 0; visibility: hidden;
  transition: opacity .6s ease, visibility 0s linear .6s, transform .6s cubic-bezier(.2,.7,.2,1);
  transform: scale(1.02);
}
.deck .slide.active { opacity: 1; visibility: visible; transform: none; transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
.deck .slide.enter .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
.deck .slide.enter .rise:nth-child(2) { animation-delay: .08s; }
.deck .slide.enter .rise:nth-child(3) { animation-delay: .16s; }
.deck .slide.enter .rise:nth-child(4) { animation-delay: .24s; }
.deck .eyebrow { font-size: 30px; font-weight: 500; color: var(--red); letter-spacing: .02em; }
.deck .h-hero { font-size: 200px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
.deck .h-big { font-size: 150px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; }
.deck .h-title { font-size: 96px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.1; text-wrap: balance; }
.deck .lead { font-size: 44px; font-weight: 400; color: var(--muted); line-height: 1.45; letter-spacing: -0.01em; }
.deck .lead b { color: var(--fg); font-weight: 700; }
.deck .grad { background: linear-gradient(180deg, #FFFFFF 30%, #8E8E93 120%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.deck .red { color: var(--red); }
.deck .head { display: flex; flex-direction: column; gap: 24px; }
.deck .spacer { flex: 1; }
.deck .glass {
  background: var(--glass); border: 1px solid var(--line); border-radius: 44px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.deck .apple { display: block; filter: drop-shadow(0 40px 80px rgba(255, 40, 30, .35)); }
.deck .glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,59,48,.38) 0%, rgba(255,59,48,0) 65%); pointer-events: none; }
.deck .s-cover { flex-direction: row; align-items: center; gap: 40px; }
.deck .s-cover .copy { flex: 1; display: flex; flex-direction: column; gap: 40px; position: relative; z-index: 1; }
.deck .s-cover .meta { font-size: 32px; color: var(--muted); letter-spacing: .02em; }
.deck .s-cover .art { position: relative; width: 760px; height: 820px; display: grid; place-items: center; }
.deck .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
.deck .step { padding: 44px 32px; display: flex; flex-direction: column; gap: 56px; min-height: 280px; min-width: 0; }
.deck .step .n { font-size: 30px; color: var(--muted); font-weight: 500; }
.deck .step .t { font-size: 42px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
.deck .step.last .n { color: var(--red); }
.deck .join { display: flex; align-items: center; gap: 32px; }
.deck .howto { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-block: 56px 52px; }
.deck .how { padding: 30px 32px; border-radius: 32px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.deck .how .n { font-size: 26px; color: var(--red); font-weight: 700; }
.deck .how .t { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; word-break: keep-all; }
.deck .half { padding: 40px 48px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
.deck .half .w { white-space: nowrap; font-size: 96px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.deck .half .m { font-size: 34px; color: var(--muted); }
.deck .op { font-size: 72px; font-weight: 300; color: var(--muted); }
.deck .whole { flex-shrink: 0; padding: 40px 48px; border-radius: 44px; background: linear-gradient(160deg, #FF5147, #C8160C); box-shadow: 0 30px 80px rgba(255,59,48,.35); display: flex; flex-direction: column; gap: 16px; }
.deck .whole .w { font-size: 84px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.deck .whole .m { font-size: 32px; color: rgba(255,255,255,.85); }
.deck .slide.enter .half.l { animation: slideL .9s cubic-bezier(.2,.7,.2,1) both; }
.deck .slide.enter .half.r { animation: slideR .9s cubic-bezier(.2,.7,.2,1) both; }
.deck .slide.enter .whole { animation: pop 1s cubic-bezier(.2,.9,.3,1.2) .5s both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
.deck .s-idioms { padding: 96px 120px 110px; gap: 48px; }
.deck .s-idioms .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
.deck .s-idioms .h-title { font-size: 80px; }
.deck .s-idioms .hint { font-size: 34px; color: var(--muted); text-align: right; }
.deck .idioms { flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 20px; }
.deck .idiom { min-width: 0; padding: 28px 26px 26px; border-radius: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.deck .idiom .w { font-size: 50px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.deck .idiom .w span { color: var(--muted); font-weight: 700; }
.deck .idiom .m { font-size: 24px; line-height: 1.4; color: var(--muted); word-break: keep-all; }
.deck .slide.enter .idiom { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 28ms); }
.deck .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; flex: 1; margin-top: 72px; }
.deck .tile { padding: 64px 56px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.deck .tile .n { font-size: 30px; color: var(--muted); font-weight: 500; }
.deck .tile .t { font-size: 72px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.12; }
.deck .tile .d { font-size: 34px; color: var(--muted); line-height: 1.45; }
.deck .tile .ic { width: 120px; height: 120px; }
.deck .rows { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; margin-top: 72px; }
.deck .row { padding: 48px 56px; display: flex; align-items: center; gap: 44px; }
.deck .row .n { font-size: 96px; font-weight: 900; color: var(--dim); width: 80px; line-height: 1; }
.deck .row .t { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
.deck .row .d { font-size: 32px; color: var(--muted); margin-top: 10px; }

  const view = root.querySelector('.view'), tbar = root.querySelector('.tbar'), tbarI = tbar.firstElementChild;
  const hphase = root.querySelector('.hphase'), resetBtn = root.querySelector('[data-act=reset]');
  let st = {}, key = '', closing = -1, resetArm = 0;

  /* ---- 키노트 슬라이드 ---- */
  const deck = root.querySelector('.deck');
  const POS = 'appleday-host-pos-' + CONFIG.room;
  let mode = 'quiz', di = 0, pre = [], post = [], loaded = false;
  if (deck) {
    deck.innerHTML = document.getElementById('deck-tpl').innerHTML;
    pre = [...deck.querySelectorAll('[data-deck=pre]')]; post = [...deck.querySelectorAll('[data-deck=post]')];
    const grid = deck.querySelector('#idioms');
    if (grid) IDIOMS.forEach((w, i) => {
      const el = document.createElement('div'); el.className = 'idiom glass'; el.style.setProperty('--i', i);
      el.innerHTML = `<p class="w">${w.slice(0, 2)}<span>${w.slice(2)}</span></p><p class="m">${IDIOM_MEAN[i]}</p>`;
      grid.append(el);
    });
    const p = lsGet(POS); if (p && (p.mode === 'pre' || p.mode === 'post')) { mode = p.mode; di = p.di || 0; } else if (!p) mode = 'pre';
  }
  function showDeck() {
    if (!deck) return;
    lsSet(POS, { mode, di });
    deck.hidden = mode === 'quiz';
    if (mode === 'quiz') { key = ''; render(); return; }
    const list = mode === 'pre' ? pre : post;
    di = Math.max(0, Math.min(list.length - 1, di));
    [...pre, ...post].forEach(x => x.classList.remove('active', 'enter'));
    const sl = list[di]; sl.classList.add('active'); void sl.offsetWidth; sl.classList.add('enter');
    hphase.textContent = (mode === 'pre' ? '키노트 ' : '마무리 ') + (di + 1) + ' / ' + list.length;
  }
  function deckNext() {
    if (mode === 'pre') { if (di < pre.length - 1) di++; else mode = 'quiz'; }
    else if (mode === 'post') di++;
    showDeck();
  }
  function deckPrev() {
    if (mode === 'pre') di--;
    else if (mode === 'post') { if (di > 0) di--; else mode = 'quiz'; }
    showDeck();
  }

  function fit() { const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; }
  new ResizeObserver(fit).observe(vp); fit();

  const playURL = location.origin + location.pathname + '#play';

  /* ---- 진행 ---- */
  function startQ(i) {
    const q = QUESTIONS[i], now = store.now();
    store.update({ 'meta/phase': 'question', 'meta/q': i, 'meta/startAt': now, 'meta/endAt': now + q.time * 1000, ['starts/' + i]: now });
  }
  function next() {
    if (deck && mode !== 'quiz') return deckNext();
    const m = meta(st);
    if (deck && m.phase === 'final' && m.fstep >= 5) { mode = 'post'; di = 0; return showDeck(); }
    switch (m.phase) {
      case 'lobby': store.update({ 'meta/phase': 'intro', 'meta/q': -1 }); break;
      case 'intro': startQ(m.q + 1); break;
      case 'question': store.update({ 'meta/phase': 'closed' }); break;
      case 'closed': store.update({ 'meta/phase': 'reveal' }); break;
      case 'reveal': store.update({ 'meta/phase': 'board' }); break;
      case 'board': {
        const n = m.q + 1;
        if (n >= NQ) store.update({ 'meta/phase': 'final', 'meta/fstep': 0 });
        else if (QUESTIONS[n].round !== QUESTIONS[m.q].round) store.update({ 'meta/phase': 'intro' });
        else startQ(n);
        break;
      }
      case 'final': if (m.fstep < 5) store.update({ 'meta/fstep': m.fstep + 1 }); break;
    }
  }
  function prev() {
    if (deck && mode !== 'quiz') return deckPrev();
    const m = meta(st);
    if (deck && m.phase === 'lobby') { mode = 'pre'; di = pre.length - 1; return showDeck(); }
    if (m.phase === 'board') store.update({ 'meta/phase': 'reveal' });
    else if (m.phase === 'reveal') store.update({ 'meta/phase': 'closed' });
    else if (m.phase === 'final' && m.fstep > 0) store.update({ 'meta/fstep': m.fstep - 1 });
    else if (m.phase === 'final') store.update({ 'meta/phase': 'board', 'meta/q': NQ - 1 });
  }
  function reset() {
    if (Date.now() - resetArm < 3000) { resetArm = 0; resetBtn.textContent = '초기화'; resetBtn.classList.remove('warn'); store.remove(''); return; }
    resetArm = Date.now(); resetBtn.textContent = '한 번 더 누르면 모두 지워져요'; resetBtn.classList.add('warn');
    setTimeout(() => { if (resetArm && Date.now() - resetArm >= 2900) { resetArm = 0; resetBtn.textContent = '초기화'; resetBtn.classList.remove('warn'); } }, 3000);
  }
  function full() {
    try { if (document.fullscreenElement) document.exitFullscreen(); else (opts.demo ? hostEl : document.documentElement).requestFullscreen().catch(() => {}); } catch (e) {}
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) {
      if (deck && mode !== 'quiz' && e.target.closest('.viewport')) { const r = vp.getBoundingClientRect(); (e.clientX - r.left < r.width * 0.3) ? deckPrev() : deckNext(); }
      return;
    }
    ({ next, prev, full, reset, start: next })[b.dataset.act]?.();
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, .devframe')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') full();
  });

  /* ---- 화면 만들기 ---- */
  function head(i, q, right) {
    return `<div class="qhead rise"><p class="eyebrow">Q${pad(i + 1)} <span class="of">/ ${NQ}</span> · ${ROUND[q.round]} · ${q.kind}</p>${right || ''}</div>`;
  }
  function vLobby() {
    let qr = '';
    try { const g = qrcode(0, 'M'); g.addData(playURL); g.make(); qr = `<img src="${g.createDataURL(10, 0)}" alt="태블릿 접속 QR 코드">`; } catch (e) { qr = '<p class="cap">QR을 만들지 못했어요</p>'; }
    return `<div class="ltop">
        <div class="lcopy">
          <p class="eyebrow rise">2026 Apple Day · 고흥대서중학교</p>
          <h1 class="h-big grad rise" style="--d:1">애플데이<br>퀴즈 대회.</h1>
          <div class="lsteps rise" style="--d:2">
            <p><span>1</span>태블릿 카메라로 QR을 찍어요</p>
            <p><span>2</span>우리 팀 사자성어를 골라요</p>
            <p><span>3</span>시작 신호를 기다려요</p>
          </div>
          <button type="button" class="startbtn rise" style="--d:3" data-act="start">퀴즈 시작</button>
        </div>
        <div class="qrcard rise" style="--d:2">${qr}<p class="cap">태블릿으로 찍어 주세요</p><p class="url">${esc(playURL)}</p></div>
      </div>
      <div class="lteams rise" style="--d:4"><p class="lcount">참가한 팀 <b data-live="tcount">0</b> / ${IDIOMS.length}</p><div class="teams" data-live="teams"></div></div>`;
  }
  function vIntro(round) {
    if (round === 1) return `<div class="head"><p class="eyebrow rise">1라운드 · 1번 ~ ${R1N}번</p><h2 class="h-title rise" style="--d:1">이심전심 라운드.</h2><p class="lead rise" style="--d:2">한 명은 <b>보고</b>, 한 명은 <b>듣고</b>. 말로만 통해야 해요.</p></div>
      <div class="roles">
        <div class="role glass rise" style="--d:3"><span class="tag">문제 보는 사람</span><p class="t">화면을 보고<br>짝에게 설명해요</p><p class="d">태블릿은 만질 수 없어요<br>보기는 짝의 태블릿에만 나와요</p></div>
        <div class="role glass rise" style="--d:4"><span class="tag">답 입력하는 사람</span><p class="t">화면을 등지고<br>답만 눌러요</p><p class="d">짝의 설명만 듣고 정답 선택<br>화면을 돌아보면 안 돼요</p></div>
      </div>`;
    return `<div class="center"><p class="eyebrow rise">2라운드 · ${R1N + 1}번 ~ ${NQ}번</p><h2 class="h-big grad rise" style="--d:1">동고동락 라운드.</h2><p class="lead rise" style="--d:2">이제는 <b>둘이 함께</b> 화면을 보며 풀어요. 정답은 직접 입력해요.</p>
      <div class="chips rise" style="--d:3"><span class="chip">인물 퀴즈 <b>8문제</b></span><span class="chip">학생 설문 <b>7문제</b></span><span class="chip">정확한 답만 <b>정답</b></span></div></div>`;
  }
  function vQuestion(i, q) {
    const live = `<div class="live"><span class="sub"><b data-live="count">0</b> / <span data-live="teams">0</span>팀 제출</span><span class="timer" data-live="timer">${q.time}</span></div>`;
    let body;
    if (q.draw) body = `<div class="qsplit"><div class="copy"><h2 class="h-title rise" style="--d:1">이 그림을<br>말로 설명해요.</h2><p class="lead rise" style="--d:2">도형의 <b>모양, 색, 위치</b>를 말로 전해요.<br>짝은 태블릿의 그림 4장 중에서 골라요.</p></div><div class="board glass rise" style="--d:2">${shapeSvg(q.options[q.answer])}</div></div>`;
    else if (q.cho) body = `<div class="qcenter"><p class="lead rise" style="--d:1">초성만 소리 내어 읽어 주세요. <b>낱말을 말하면 안 돼요.</b></p><div class="cho ${q.cho.replace(/ /g, '').length > 5 ? 'sm' : ''} rise" style="--d:2">${[...q.cho].map(c => c === ' ' ? '<i></i>' : `<span class="glass">${c}</span>`).join('')}</div></div>`;
    else if (q.emoji) body = `<div class="qcenter"><p class="lead rise" style="--d:1">이모지를 보고 떠오르는 <b>속담</b>을 설명해요. 속담을 그대로 말하면 안 돼요.</p><div class="emo ${q.emoji.length > 12 ? 'sm' : ''} rise" style="--d:2">${q.emoji}</div></div>`;
    else if (q.video) body = `<div class="qsplit"><div class="vframe rise" style="--d:1"><video src="${q.video}#t=0.05" muted playsinline preload="auto"></video></div><div class="copy"><p class="eyebrow rise">인물 퀴즈</p><h2 class="h-big grad rise" style="--d:1">누구일까요?</h2><p class="lead rise" style="--d:2">태블릿에 <b>이름을 정확하게</b> 입력해요.<br>띄어쓰기는 상관없어요.</p></div></div>`;
    else body = `<div class="qcenter"><p class="prompt grad rise" style="--d:1">${esc(q.prompt)}</p><p class="lead rise" style="--d:2">${q.round === 1 ? '문제를 보는 사람이 짝에게 읽어 주세요. <b>보기는 짝의 태블릿에만</b> 있어요.' : '둘이 상의해서 태블릿에 <b>정답을 입력</b>해요.'}</p></div>`;
    const foot = q.round === 1 ? `<div class="r1foot rise" style="--d:3"><span class="pill-red">이심전심</span><p>답을 누르는 사람은 화면을 등지고 앉아요.</p></div>` : '';
    return head(i, q, live) + body + foot + `<div class="closedbadge">마감 · 곧 정답을 공개해요</div>`;
  }
  function vReveal(i, q) {
    const a = (st.answers || {})[i] || {}, vals = Object.values(a), nT = cnt(st.teams);
    const nOk = vals.filter(x => isCorrect(q, x.v)).length;
    const right = `<div class="live"><span class="sub">정답 <b>${nOk}</b> / ${nT}팀</span></div>`;
    if (q.type === 'mc') {
      const c = q.options.map((_, k) => vals.filter(x => Number(x.v) === k).length), mx = Math.max(1, ...c);
      return head(i, q, right) + `<p class="rtitle ${q.emoji ? 'e' : ''} rise" style="--d:1">${esc(qTitle(q))}</p>
        <div class="opts">${q.options.map((o, k) => `<div class="opt glass ${k === q.answer ? 'ok' : 'no'} rise" style="--d:${k + 2}">
          <span class="n">${k + 1}</span>${q.draw ? `<div class="pic">${shapeSvg(o)}</div>` : `<span class="lab">${esc(o)}</span>`}
          <span class="cnt">${c[k]}팀</span><span class="bar" style="width:${c[k] / mx * 100}%"></span></div>`).join('')}</div>`;
    }
    const groups = {};
    vals.forEach(x => { const k = norm(x.v); if (!k) return; (groups[k] = groups[k] || { label: String(x.v).trim(), n: 0, ok: isCorrect(q, x.v) }).n++; });
    const chips = Object.values(groups).sort((x, y) => (y.ok - x.ok) || (y.n - x.n)).slice(0, 24)
      .map(g => `<span class="sub-c ${g.ok ? 'ok' : ''}">${esc(g.label)}<b>${g.n}</b></span>`).join('');
    const subs = chips ? `<div class="subs rise" style="--d:3">${chips}</div>` : `<p class="lead rise" style="--d:3;margin-top:48px">제출한 답이 없어요.</p>`;
    if (q.video) return head(i, q, right) + `<div class="qsplit"><div class="vframe rise" style="--d:1"><video src="${q.video}" muted playsinline preload="auto" data-reveal></video></div>
        <div class="copy"><p class="eyebrow">정답</p><p class="h-big grad pname">${esc(q.answer)}</p>${subs}</div></div>`;
    return head(i, q, right) + `<p class="rtitle rise" style="--d:1">${esc(q.prompt)}</p><div class="ansrow rise" style="--d:2"><span class="ansbig">${esc(q.answer)}</span></div>${subs}`;
  }
  function vBoard(i) {
    const rows = scoreboard(st, i), top = rows.slice(0, 5);
    const nxt = i + 1 >= NQ ? '다음: 최종 결과 발표' : (QUESTIONS[i + 1].round !== QUESTIONS[i].round ? '다음: 2라운드 동고동락' : `다음: Q${pad(i + 2)}`);
    return `<div class="head"><p class="eyebrow rise">Q${pad(i + 1)} 결과 · 참가 ${rows.length}팀</p><h2 class="h-title rise" style="--d:1;font-size:84px">지금 순위 TOP 5</h2></div>
      ${top.length ? `<div class="rlist">${top.map((r, k) => `<div class="rrow ${k === 0 ? 'first' : ''} rise" style="--d:${k + 2}"><span class="rk">${k + 1}</span><span class="nm">${esc(r.name)}</span><span class="gain">${r.gains[i] ? '+' + r.gains[i] : ''}</span><span class="sc">${r.score}</span></div>`).join('')}</div>` : '<p class="empty">아직 참가한 팀이 없어요.</p>'}
      <p class="nexthint">${nxt}</p>`;
  }
  function vFinal(step) {
    const rows = scoreboard(st, NQ - 1), n = rows.length;
    const apple = '<svg class="apple rise" width="150" height="162" aria-hidden="true"><use href="#apple"/></svg>';
    if (step === 0) return `<div class="center s-award" style="display:flex;flex-direction:column"><div class="glow"></div>${apple}<p class="eyebrow rise" style="--d:1">Final</p><h2 class="h-hero grad rise" style="--d:2">최종 결과</h2><p class="lead rise" style="--d:3">${NQ}문제가 모두 끝났어요. 특별상부터 공개합니다.</p></div>`;
    if (step >= 1 && step <= 4) {
      let r, label, prize;
      if (step === 1) { r = n >= 5 ? rows[n - 2] : null; label = '특별상 · 뒤에서 2등'; prize = PRIZE.sp; }
      else { const rk = 5 - step; r = rows[rk - 1]; label = `${rk}등`; prize = PRIZE[rk]; }
      const big = step === 4;
      return `<div class="center s-award" style="display:flex;flex-direction:column"><div class="glow"></div>${big ? apple : ''}
        <p class="eyebrow rise" style="--d:1;font-size:40px">${label}</p>
        <h2 class="${big ? 'h-hero' : 'h-big'} grad rise" style="--d:2">${r ? esc(r.name) : '해당 팀 없음'}</h2>
        ${r ? `<p class="lead rise" style="--d:3">${r.score}점 · 정답 ${r.correct}개</p>` : `<p class="lead rise" style="--d:3">${step === 1 ? '특별상은 5팀 이상 참가했을 때 드려요.' : ''}</p>`}
        <span class="prizepill rise" style="--d:4">${prize}</span></div>`;
    }
    const sp = n >= 5 ? rows[n - 2].id : null;
    return `<div class="head"><p class="eyebrow rise">Final · 전체 순위</p><h2 class="h-title rise" style="--d:1;font-size:72px">모두 수고했어요.</h2></div>
      <div class="ftable rise" style="--d:2;grid-template-rows:repeat(${Math.max(1, Math.ceil(n / 2))}, auto)">${rows.map((r, k) => {
        const pz = k < 3 ? PRIZE[k + 1] : (r.id === sp ? PRIZE.sp : '');
        return `<div class="frow ${pz ? 'top' : ''}"><span class="rk">${k + 1}</span><span class="nm">${esc(r.name)}${pz ? `<span class="pz">${pz}</span>` : ''}</span><span class="sc">${r.score}</span></div>`;
      }).join('')}</div>`;
  }

  /* ---- 그리기 ---- */
  function viewKey(m) {
    switch (m.phase) {
      case 'lobby': return 'lobby';
      case 'intro': return 'intro' + m.q;
      case 'question': case 'closed': return 'q' + m.q;
      case 'reveal': return 'r' + m.q;
      case 'board': return 'b' + m.q;
      case 'final': return 'f' + m.fstep;
    }
    return m.phase;
  }
  function render() {
    const m = meta(st), k = viewKey(m);
    if (k !== key) {
      key = k;
      let html = '';
      if (m.phase === 'lobby') html = vLobby();
      else if (m.phase === 'intro') html = vIntro(QUESTIONS[m.q + 1].round);
      else if (m.phase === 'question' || m.phase === 'closed') html = vQuestion(m.q, QUESTIONS[m.q]);
      else if (m.phase === 'reveal') html = vReveal(m.q, QUESTIONS[m.q]);
      else if (m.phase === 'board') html = vBoard(m.q);
      else if (m.phase === 'final') html = vFinal(m.fstep);
      view.className = 'view v-' + m.phase;
      view.innerHTML = html;
      void view.offsetWidth; view.classList.add('enter');
      const v = view.querySelector('video[data-reveal]');
      if (v) {
        const name = view.querySelector('.pname'), show = () => name && name.classList.add('show');
        v.addEventListener('ended', show); setTimeout(show, 3600);
        v.play().catch(show);
      }
    }
    patch(m);
  }
  function patch(m) {
    const teams = st.teams || {}, nT = cnt(teams);
    if (m.phase === 'lobby') {
      const g = view.querySelector('[data-live=teams]');
      if (g) {
        const names = new Set(Object.values(teams).map(t => t.name));
        const sig = [...names].sort().join(',');
        if (g.dataset.sig !== sig) { g.dataset.sig = sig; g.innerHTML = IDIOMS.map(n => `<span class="tm ${names.has(n) ? 'on' : ''}">${n}</span>`).join(''); }
        view.querySelector('[data-live=tcount]').textContent = nT;
      }
    }
    if (m.phase === 'question' || m.phase === 'closed') {
      const a = (st.answers || {})[m.q] || {};
      const c = view.querySelector('[data-live=count]'); if (c) c.textContent = cnt(a);
      const t = view.querySelector('[data-live=teams]'); if (t) t.textContent = nT;
      view.classList.toggle('closed', m.phase === 'closed');
    }
    const labels = { lobby: '대기실', intro: '라운드 안내', question: `Q${m.q + 1} 진행 중`, closed: `Q${m.q + 1} 마감`, reveal: `Q${m.q + 1} 정답`, board: `Q${m.q + 1} 순위`, final: `최종 발표 ${m.fstep}/5` };
    if (!deck || mode === 'quiz') hphase.textContent = labels[m.phase] || '';
    tick();
  }
  function tick() {
    const m = meta(st);
    if (m.phase !== 'question' && m.phase !== 'closed') { tbar.hidden = true; return; }
    const q = QUESTIONS[m.q], lim = q.time * 1000;
    const rem = m.phase === 'closed' ? 0 : Math.max(0, (m.endAt || 0) - store.now());
    tbar.hidden = false; tbarI.style.width = (rem / lim * 100) + '%';
    const t = view.querySelector('[data-live=timer]');
    if (t) { t.textContent = Math.ceil(rem / 1000); t.classList.toggle('low', rem <= 5000); }
    if (m.phase === 'question' && closing !== m.q) {
      const nT = cnt(st.teams), nA = cnt((st.answers || {})[m.q]);
      if (rem <= 0 || (nT > 0 && nA >= nT)) { closing = m.q; store.update({ 'meta/phase': 'closed' }); }
    }
  }
  setInterval(tick, 200);
  store.subscribe(s => {
    st = s || {}; if (meta(st).phase === 'lobby') closing = -1;
    if (!loaded) { loaded = true; const ph = meta(st).phase; if (deck && mode === 'pre' && ph !== 'lobby') mode = 'quiz'; if (deck) showDeck(); }
    render();
  });
}

/* =====================================================================
   6. 태블릿 화면 (학생)
   ===================================================================== */
function Tablet(root, store, opts) {
  const LS = 'appleday-team-' + CONFIG.room;
  const dev = opts.deviceId;
  let me = opts.memoryOnly ? null : lsGet(LS);
  let st = null, key = '', sel = null;
  root.innerHTML = '<div class="tab"></div>';
  const el = root.firstElementChild;
  const save = () => { if (!opts.memoryOnly) lsSet(LS, me); };

  function team() { return me && (st.teams || {})[me.id]; }
  function myAns(i) { return me && ((st.answers || {})[i] || {})[me.id]; }
  function myRank(upto) { const rows = scoreboard(st, upto); const k = rows.findIndex(r => r.id === String(me.id)); return { rank: k + 1, row: rows[k], n: rows.length }; }

  function headHtml() { const t = team(); return `<div class="thead"><div class="tteam"><small>우리 팀</small>${esc(t ? t.name : '')}</div><div class="ttimer" data-live="t"></div></div>`; }
  function vPick() {
    const taken = new Set(Object.values(st.teams || {}).map(t => t.name));
    return `<div class="tcard"><p class="tey">애플데이 퀴즈 대회</p><p class="tbig">우리 팀 사자성어를 골라요.</p><p class="tmuted">짝 찾기에서 맞춘 사자성어를 누르세요. 다른 팀이 이미 고른 이름은 고를 수 없어요.</p></div>
      <div class="picker">${IDIOMS.map((n, i) => `<button type="button" class="pk" data-pick="${i}" ${taken.has(n) ? 'disabled' : ''}>${n}${taken.has(n) ? '<small>참가 중</small>' : ''}</button>`).join('')}</div>
      <p class="tmsg" data-live="msg"></p>${store.demo && !opts.memoryOnly ? '<p class="tbanner">시연 모드 · Firebase를 연결하면 여러 태블릿이 함께 참여할 수 있어요</p>' : ''}`;
  }
  function vWait(m) {
    if (m.phase === 'intro') {
      const r = QUESTIONS[m.q + 1].round;
      return headHtml() + `<div class="tcard"><p class="tey">${r}라운드</p><p class="tbig">${ROUND[r]} 라운드</p><p class="tmuted">${r === 1 ? '한 명은 큰 화면을 보고 설명하고, <b>태블릿을 든 사람은 화면을 등지고</b> 앉아요.' : '이제 <b>둘이 함께</b> 화면을 보며 풀어요. 정답은 직접 입력해요.'}</p></div>`;
    }
    return headHtml() + `<div class="tcard"><p class="tey">준비 완료</p><p class="tbig">${esc(team().name)} 팀,<br>반가워요!</p><p class="tmuted">선생님이 시작하면 문제가 열려요. 큰 화면을 봐 주세요.</p></div>
      <button type="button" class="tghost" data-act="leave">팀 다시 고르기</button>`;
  }
  function vQuestion(i, q) {
    const a = myAns(i);
    const note = `<p class="tnote">Q${pad(i + 1)} / ${NQ} · ${q.kind}</p>`;
    if (a) return headHtml() + note + `<div class="tcard"><p class="tey">제출 완료</p><p class="tbig">${esc(q.type === 'mc' ? optLabel(q, Number(a.v)) : a.v)}</p><p class="tmuted">정답 공개를 기다려요.</p></div>`;
    const r1 = q.round === 1 ? '<p class="tnote r">화면을 등지고 짝의 설명만 들어요</p>' : '';
    const prompt = q.round === 2 ? `<p class="tprompt">${q.video ? '화면 속 인물은 누구일까요?' : esc(q.prompt)}</p>` : '';
    let body;
    if (q.type === 'mc') body = `<div class="topts">${q.options.map((o, k) => `<button type="button" class="topt ${sel === k ? 'sel' : ''}" data-opt="${k}"><span class="n">${k + 1}</span>${q.draw ? shapeSvg(o) : `<span>${esc(o)}</span>`}</button>`).join('')}</div>`;
    else body = `<input class="tinput" id="tin-${dev}" maxlength="30" placeholder="정답을 입력하세요" autocomplete="off" enterkeyhint="done">`;
    return headHtml() + note + r1 + prompt + body + `<button type="button" class="tsubmit" data-act="submit" ${q.type === 'mc' && sel == null ? 'disabled' : ''}>제출하기</button><p class="tmsg" data-live="msg"></p>`;
  }
  function vClosed(i, q) {
    const a = myAns(i);
    return headHtml() + `<div class="tcard"><p class="tey">마감</p><p class="tbig">${a ? '제출한 답으로<br>채점해요.' : '이번 문제는<br>제출하지 못했어요.'}</p>${a ? `<p class="tmuted">우리 답: <b>${esc(q.type === 'mc' ? optLabel(q, Number(a.v)) : a.v)}</b></p>` : ''}<p class="tmuted">정답은 큰 화면에서 공개돼요.</p></div>`;
  }
  function vReveal(i, q) {
    const a = myAns(i), ok = a && isCorrect(q, a.v), g = points(q, a, (st.starts || {})[i]);
    const { rank, row, n } = myRank(i);
    return headHtml() + `<div class="tcard"><div class="mark ${ok ? 'ok' : ''}">${ok ? '✓' : '✕'}</div>
      <p class="tbig">${ok ? `정답! +${g}점` : (a ? '아쉬워요.' : '미제출')}</p>
      <p class="tmuted">정답: <b>${esc(q.type === 'mc' ? optLabel(q, q.answer) : q.answer)}</b></p>
      <div class="tstat"><span>총점 <b>${row ? row.score : 0}</b>점</span><span>현재 <b>${rank}</b>위 / ${n}팀</span></div></div>`;
  }
  function vBoard(i) {
    const { rank, row, n } = myRank(i);
    return headHtml() + `<div class="tcard"><p class="tey">Q${pad(i + 1)}까지</p><p class="tbig">지금 ${rank}위</p><div class="tstat"><span>총점 <b>${row ? row.score : 0}</b>점</span><span>참가 ${n}팀</span></div><p class="tmuted">다음 문제를 기다려요.</p></div>`;
  }
  function vFinal(step) {
    if (step < 5) return headHtml() + `<div class="tcard"><p class="tey">최종 결과</p><p class="tbig">결과 발표 중이에요.</p><p class="tmuted">큰 화면을 봐 주세요!</p></div>`;
    const rows = scoreboard(st, NQ - 1), k = rows.findIndex(r => r.id === String(me.id)), n = rows.length;
    const pz = k < 3 ? PRIZE[k + 1] : (n >= 5 && k === n - 2 ? PRIZE.sp : '');
    return headHtml() + `<div class="tcard"><p class="tey">최종 순위</p><p class="tbig">${k + 1}위 · ${rows[k] ? rows[k].score : 0}점</p>${pz ? `<p class="tmuted">상품: <b>${pz}</b></p>` : ''}<p class="tmuted">함께해 줘서 고마워요.</p></div>`;
  }

  function render() {
    if (!st) return;
    const m = meta(st);
    if (me && (!team() || team().dev !== dev)) { me = null; save(); }
    let k, html;
    if (!me) { k = 'pick:' + Object.values(st.teams || {}).map(t => t.name).sort().join(','); }
    else if (m.phase === 'lobby' || m.phase === 'intro') k = 'w' + m.phase + m.q;
    else if (m.phase === 'question') k = 'q' + m.q + (myAns(m.q) ? 's' : '');
    else if (m.phase === 'closed') k = 'c' + m.q;
    else if (m.phase === 'reveal') k = 'r' + m.q;
    else if (m.phase === 'board') k = 'b' + m.q;
    else k = 'f' + (m.fstep >= 5 ? 5 : 0);
    if (k === key) return tickT();
    if (k[0] === 'q') sel = null;
    key = k;
    if (!me) html = vPick();
    else if (m.phase === 'lobby' || m.phase === 'intro') html = vWait(m);
    else if (m.phase === 'question') html = vQuestion(m.q, QUESTIONS[m.q]);
    else if (m.phase === 'closed') html = vClosed(m.q, QUESTIONS[m.q]);
    else if (m.phase === 'reveal') html = vReveal(m.q, QUESTIONS[m.q]);
    else if (m.phase === 'board') html = vBoard(m.q);
    else html = vFinal(m.fstep);
    el.innerHTML = html;
    tickT();
  }
  function tickT() {
    if (!st) return;
    const t = el.querySelector('[data-live=t]'); if (!t) return;
    const m = meta(st);
    if (m.phase !== 'question') { t.textContent = ''; return; }
    const rem = Math.max(0, (m.endAt || 0) - store.now());
    t.textContent = Math.ceil(rem / 1000) + '초'; t.classList.toggle('low', rem <= 5000);
  }
  function msg(s) { const x = el.querySelector('[data-live=msg]'); if (x) x.textContent = s; }

  async function submit() {
    const m = meta(st), q = QUESTIONS[m.q];
    if (m.phase !== 'question' || store.now() > (m.endAt || 0) + 800) return msg('제출 시간이 지났어요.');
    let v;
    if (q.type === 'mc') { if (sel == null) return; v = sel; }
    else { const inp = el.querySelector('.tinput'); v = (inp.value || '').trim(); if (!v) return msg('정답을 입력해 주세요.'); }
    const ok = await store.setIfAbsent(`answers/${m.q}/${me.id}`, { v, at: TS });
    if (!ok) msg('이미 제출했어요.');
  }
  el.addEventListener('click', async e => {
    const p = e.target.closest('[data-pick]');
    if (p) {
      const i = Number(p.dataset.pick);
      const ok = await store.setIfAbsent('teams/' + i, { name: IDIOMS[i], at: TS, dev });
      if (ok) { me = { id: i }; save(); key = ''; render(); } else msg('방금 다른 팀이 골랐어요. 다시 골라 주세요.');
      return;
    }
    const o = e.target.closest('[data-opt]');
    if (o) { sel = Number(o.dataset.opt); el.querySelectorAll('.topt').forEach(b => b.classList.toggle('sel', Number(b.dataset.opt) === sel)); el.querySelector('.tsubmit').disabled = false; return; }
    const b = e.target.closest('[data-act]');
    if (b && b.dataset.act === 'submit') submit();
    if (b && b.dataset.act === 'leave') { store.remove('teams/' + me.id); me = null; save(); }
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('tinput')) { e.preventDefault(); submit(); } });
  setInterval(tickT, 250);
  store.subscribe(s => { st = s || {}; render(); });
}

/* =====================================================================
   7. 시연용 가상 팀
   ===================================================================== */
function Bots(store) {
  let st = {}, on = true; const sched = new Set();
  const wrong = ['몰라요', '국어', '피자', '쉬는시간', '도서관', '김민준', '급식실', '수학'];
  store.subscribe(s => { st = s || {}; drive(); });
  function drive() {
    const m = meta(st); if (!on || m.phase !== 'question') return;
    const q = QUESTIONS[m.q], teams = st.teams || {}, ans = (st.answers || {})[m.q] || {};
    for (const id in teams) {
      if (!String(teams[id].dev).startsWith('bot')) continue;
      const k = m.q + ':' + id; if (sched.has(k) || ans[id]) continue; sched.add(k);
      setTimeout(() => {
        const mm = meta(st); if (mm.phase !== 'question' || mm.q !== m.q) return;
        const good = Math.random() < 0.62;
        let v;
        if (q.type === 'mc') v = good ? q.answer : [0, 1, 2, 3].filter(x => x !== q.answer)[Math.floor(Math.random() * 3)];
        else v = good ? q.answer : wrong[Math.floor(Math.random() * wrong.length)];
        store.setIfAbsent(`answers/${m.q}/${id}`, { v, at: TS });
      }, 1500 + Math.random() * q.time * 600);
    }
  }
  return {
    add(n) { const teams = st.teams || {}; let c = 0; for (let i = IDIOMS.length - 1; i >= 0 && c < n; i--) if (!teams[i]) { store.setIfAbsent('teams/' + i, { name: IDIOMS[i], at: TS, dev: 'bot' + i }); c++; } },
    toggle() { on = !on; drive(); return on; }
  };
}

/* =====================================================================
   8. 시작
   ===================================================================== */
const app = document.getElementById('app');
const route = (location.hash || '').slice(1);
window.addEventListener('hashchange', () => location.reload());

async function realStore() {
  if (!CONFIG.firebase) return new MemStore();
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js');
    await loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js');
    return new FireStore(CONFIG.firebase, CONFIG.room);
  } catch (e) { console.error(e); return new MemStore(); }
}

(async function boot() {
  if (route === 'host') {
    document.body.classList.add('lock');
    Host(app, await realStore(), { demo: false, deck: true });
  } else if (route === 'play') {
    let dev = lsGet('appleday-device'); if (!dev) { dev = uid(); lsSet('appleday-device', dev); }
    Tablet(app, await realStore(), { deviceId: dev });
  } else if (route === 'demo') {
    document.body.classList.add('lock');
    const store = new MemStore();
    app.innerHTML = `<div class="demo"><div class="demo-host"></div><aside class="demo-side">
      <div class="demo-tools"><p>시연 모드예요. 왼쪽은 도서관 송출 화면, 오른쪽은 학생 태블릿 두 대예요. 태블릿에서 팀을 고르고, 송출 화면의 <b>퀴즈 시작</b>과 아래쪽 <b>다음 ▶</b>(또는 스페이스바)로 진행해 보세요.</p>
        <div class="row"><button type="button" data-d="bots">가상 팀 8개 넣기</button><button type="button" data-d="auto">가상 팀 자동 답안: 켜짐</button></div></div>
      <div class="devframe"><span class="devlabel">태블릿 A</span><div data-tab="a"></div></div>
      <div class="devframe"><span class="devlabel">태블릿 B</span><div data-tab="b"></div></div></aside></div>`;
    Host(app.querySelector('.demo-host'), store, { demo: true });
    Tablet(app.querySelector('[data-tab=a]'), store, { deviceId: 'devA', memoryOnly: true });
    Tablet(app.querySelector('[data-tab=b]'), store, { deviceId: 'devB', memoryOnly: true });
    const bots = Bots(store);
    app.querySelector('.demo-tools').addEventListener('click', e => {
      const b = e.target.closest('[data-d]'); if (!b) return;
      if (b.dataset.d === 'bots') bots.add(8);
      if (b.dataset.d === 'auto') b.textContent = '가상 팀 자동 답안: ' + (bots.toggle() ? '켜짐' : '꺼짐');
    });
  } else {
    app.innerHTML = `<div class="launch">
      <p class="eyebrow" style="font-size:16px">2026 Apple Day · 고흥대서중학교</p>
      <h1 class="grad">애플데이<br>퀴즈 대회</h1>
      <div class="lgrid">
        <a class="lbtn main" href="#demo"><b>시연해 보기</b><span>송출 화면과 태블릿 두 대를 한 화면에서 미리 돌려 봐요.</span></a>
        <a class="lbtn" href="#host"><b>송출 화면 (선생님)</b><span>표지부터 퀴즈, 마무리 인사까지 한 화면으로 진행해요. 도서관 큰 화면으로 내보내요.</span></a>
        <a class="lbtn" href="#play"><b>태블릿 참가</b><span>학생 태블릿용 화면이에요. 보통은 QR로 들어와요.</span></a>
      </div>
      <p class="lstatus">${CONFIG.firebase ? '실시간 연결: Firebase 사용 중' : '실시간 연결: 아직 Firebase 설정 전이라 기기끼리 연결되지 않아요. 시연은 바로 가능해요.'}</p></div>`;
  }
})();
})();
</script>
